name: Build WAX206 256M Passwall Firmware (Latest)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl

    - name: Clone OpenWrt Official Source (Latest)
      run: |
        git clone https://github.com/openwrt/openwrt.git openwrt

    - name: Add Passwall Feeds & Apply 256M Patch
      working-directory: ./openwrt
      run: |
        # 1. 引入最新的 Passwall 源
        echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main" >> feeds.conf.default
        echo "src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main" >> feeds.conf.default
        ./scripts/feeds update -a
        
        # 2. 解决最新源码库的依赖冲突（强制删除官方自带版本）
        rm -rf feeds/packages/net/{xray-core,v2ray-geodata,sing-box,chinadns-ng,dns2socks,hysteria,ipt2socks,microsocks,naiveproxy,shadowsocks-rust,shadowsocksr-libev,simple-obfs,tcping,v2ray-plugin,xray-plugin,geoview,shadow-tls}
        ./scripts/feeds install -a

        # 3. 动态查找 DTS 文件并应用 256M 扩容
        DTS_FILE=$(find target/linux/mediatek -name "mt7622-netgear-wax206.dts")
        echo "Found DTS file at: $DTS_FILE"
        
        sed -i 's/<0x580000 0x2800000>/<0x580000 0xfa80000>/g' $DTS_FILE
        sed -i '/partition@2d80000/,/};/d' $DTS_FILE
        sed -i '/partition@5580000/,/};/d' $DTS_FILE

    - name: Configure and Compile
      working-directory: ./openwrt
      run: |
        cp ../.config .config
        make defconfig
        make download -j8
        make -j$(nproc) V=s

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WAX206-256M-Firmware-Latest
        path: openwrt/bin/targets/mediatek/mt7622/*
