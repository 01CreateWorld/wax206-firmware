name: Build WAX206 256M Passwall Firmware (Stable-24)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Free Disk Space & Install Dependencies
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl

    - name: Clone OpenWrt Source (Latest Stable 24.10)
      run: |
        # 锁定官方最新的正式大版本分支 24.10，彻底避开 master 分支循环依赖 Bug
        git clone -b openwrt-24.10 https://github.com/openwrt/openwrt.git openwrt

    - name: Update & Install Feeds
      working-directory: ./openwrt
      run: |
        # 1. 引入 Passwall 源
        echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main" >> feeds.conf.default
        echo "src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main" >> feeds.conf.default
        
        # 2. 正常更新源，避免破坏性删包
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply 256M Partition Patch
      working-directory: ./openwrt
      run: |
        # 动态定位 WAX206 DTS 并修改分区表
        DTS_FILE=$(find target/linux/mediatek -name "mt7622-netgear-wax206.dts")
        echo "Modifying DTS: $DTS_FILE"
        sed -i 's/<0x580000 0x2800000>/<0x580000 0xfa80000>/g' $DTS_FILE
        sed -i '/partition@2d80000/,/};/d' $DTS_FILE
        sed -i '/partition@5580000/,/};/d' $DTS_FILE

    - name: Generate Config & Download DL
      working-directory: ./openwrt
      run: |
        cp ../.config .config
        # 强制更新补充依赖配置并修复默认值
        make defconfig
        # 预先多线程下载所有编译包（防止编译中途断网中断）
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread compile"
        # 采用并行编译，失败时自动切单线程抓取错误详情
        make -j$(nproc) || make -j1 V=s

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WAX206-256M-Firmware
        path: |
          openwrt/bin/targets/mediatek/*/*.itb
          openwrt/bin/targets/mediatek/*/*.bin
