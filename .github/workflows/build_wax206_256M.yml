name: Build WAX206 OpenWrt 25 (Latest Master)

# 隐藏 GitHub Actions 的 Node 20 弃用警告
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Free Disk Space & Install Dependencies
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl

    - name: Clone OpenWrt Source (Latest Master / OpenWrt 25)
      run: |
        # 默认拉取官方最新的 master 分支
        git clone https://github.com/openwrt/openwrt.git openwrt

    - name: Update Feeds & Fix Go Toolchain Conflicts
      working-directory: ./openwrt
      run: |
        # 1. 引入 Passwall 源
        echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main" >> feeds.conf.default
        echo "src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main" >> feeds.conf.default
        ./scripts/feeds update -a
        
        # 2. 替换 OpenWrt 自带的低版本 Golang 为专为插件维护的高版本工具链
        rm -rf feeds/packages/lang/golang
        git clone https://github.com/sbwml/packages_lang_golang feeds/packages/lang/golang
        
        # 3. 强制删除阻碍编译的非核心边缘组件 (如引发 Go 1.25 报错的 geoview)
        rm -rf feeds/passwall_packages/geoview
        
        # 4. 强制替换 go.mod 版本限制 (将要求 1.24/1.25 的包强制降级允许使用 1.23+ 编译)
        find feeds/passwall_packages -name "go.mod" -exec sed -i 's/go 1.2[4-9].*/go 1.23.0/g' {} +
        
        # 5. 清理与官方库重叠的底层代理内核
        rm -rf feeds/packages/net/{xray-core,v2ray-geodata,sing-box,chinadns-ng,dns2socks,hysteria,ipt2socks,microsocks,naiveproxy,shadowsocks-rust,shadowsocksr-libev,simple-obfs,tcping,v2ray-plugin,xray-plugin,shadow-tls}
        
        ./scripts/feeds install -a

    - name: Apply 256M Partition Patch
      working-directory: ./openwrt
      run: |
        DTS_FILE=$(find target/linux/mediatek -name "mt7622-netgear-wax206.dts")
        echo "Modifying DTS: $DTS_FILE"
        sed -i 's/<0x580000 0x2800000>/<0x580000 0xfa80000>/g' $DTS_FILE
        sed -i '/partition@2d80000/,/};/d' $DTS_FILE
        sed -i '/partition@5580000/,/};/d' $DTS_FILE

    - name: Generate Config & Download DL
      working-directory: ./openwrt
      run: |
        cp ../.config .config
        make defconfig
        make download -j8

    - name: Compile Firmware
      working-directory: ./openwrt
      run: |
        # 采用并行编译，一旦失败自动切单线程抓取错误详情
        make -j$(nproc) || make -j1 V=s

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WAX206-256M-Firmware-OpenWrt25
        path: |
          openwrt/bin/targets/mediatek/*/*.itb
          openwrt/bin/targets/mediatek/*/*.bin
