name: Build WAX206 256M Passwall Firmware (Latest)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # 继续保持 22.04 避开新版 Ubuntu 的 Python distutils 报错

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl

    - name: Clone OpenWrt Official Source (Latest)
      run: |
        # 移除固定分支参数，直接拉取最新的 master (包含 OpenWrt 25 源码)
        git clone https://github.com/openwrt/openwrt.git openwrt

    - name: Add Passwall Feeds & Apply 256M Patch
      working-directory: ./openwrt
      run: |
        # 1. 引入 Passwall 源
        echo "src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git;main" >> feeds.conf.default
        echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall.git;main" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

        # 2. 动态查找 DTS 文件并应用 256M 扩容（适配新版源码的目录结构）
        DTS_FILE=$(find target/linux/mediatek -name "mt7622-netgear-wax206.dts")
        echo "Found DTS file at: $DTS_FILE"
        
        sed -i 's/<0x580000 0x2800000>/<0x580000 0xfa80000>/g' $DTS_FILE
        sed -i '/partition@2d80000/,/};/d' $DTS_FILE
        sed -i '/partition@5580000/,/};/d' $DTS_FILE

    - name: Configure and Compile
      working-directory: ./openwrt
      run: |
        cp ../.config .config
        make defconfig
        make download -j8
        make -j$(nproc) V=s

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WAX206-256M-Firmware-Latest
        path: openwrt/bin/targets/mediatek/mt7622/*
