name: Build WAX206 256M (Professional Fix)

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Free Disk Space & Install Dependencies
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl

    - name: Clone OpenWrt Source (Latest Master)
      run: |
        git clone https://github.com/openwrt/openwrt.git openwrt

    - name: Update Feeds & Download Source
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        cp ../.config .config
        make defconfig
        make download -j8

    - name: Inject 256M Patch (Core Fix)
      working-directory: ./openwrt
      run: |
        echo "1. 解除打包体积限制..."
        sed -i 's/40960k/256512k/g' target/linux/mediatek/image/mt7622.mk
        
        echo "2. 提前解压 Linux 内核源码 (这是之前失败的关键)..."
        make target/linux/prepare -j$(nproc)
        
        echo "3. 动态寻找解压后的 DTS 并应用扩容补丁..."
        DTS_FILE=$(find build_dir -path "*/arch/arm64/boot/dts/mediatek/mt7622-netgear-wax206.dts" | head -n 1)
        
        # 增加极其严格的防静默失败校验
        if [ -z "$DTS_FILE" ]; then
          echo "致命错误：在内核源码中找不到 WAX206 的 DTS 文件！扩容将失败！"
          exit 1
        fi
        
        echo "成功找到内核 DTS 路径: $DTS_FILE"
        
        # 精确替换分区边界 (去掉尖括号以防内核源码格式变动)
        sed -i 's/0x580000 0x2800000/0x580000 0xfa80000/g' "$DTS_FILE"
        
        # 删除备用分区节点
        sed -i '/partition@2d80000/,/};/d' "$DTS_FILE"
        sed -i '/partition@5580000/,/};/d' "$DTS_FILE"
        
        # 终极校验：检查修改是否真的写进去了
        if ! grep -q "0xfa80000" "$DTS_FILE"; then
          echo "致命错误：DTS 文件修改失败！"
          exit 1
        fi
        
        echo "DTS 扩容补丁完美注入！"

    - name: Compile Firmware
      working-directory: ./openwrt
      run: |
        make -j$(nproc) || make -j1 V=s

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WAX206-256M-Pure-Firmware
        path: |
          openwrt/bin/targets/mediatek/*/*.itb
          openwrt/bin/targets/mediatek/*/*.bin
