name: Build WAX206 256M Pure Firmware (OpenWrt 25)

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Free Disk Space & Install Dependencies
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl

    - name: Clone OpenWrt Source (Latest Master)
      run: |
        git clone https://github.com/openwrt/openwrt.git openwrt

    - name: Update Standard Feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply 256M Partition Patch
      working-directory: ./openwrt
      run: |
        # 1. 扩大内核设备树 (DTS) 的物理分区边界
        DTS_FILE=$(find target/linux/mediatek -name "mt7622-netgear-wax206.dts")
        sed -i 's/<0x580000 0x2800000>/<0x580000 0xfa80000>/g' $DTS_FILE
        sed -i '/partition@2d80000/,/};/d' $DTS_FILE
        sed -i '/partition@5580000/,/};/d' $DTS_FILE
        
        # 2. 解除镜像打包体积限制 (解决 sysupgrade 依然是 17M 的核心关键！)
        # OpenWrt 官方源码中 WAX206 默认的 IMAGE_SIZE 为 40960k (40MB)
        # 必须将其替换为 256512k (对应物理空间的 0xfa80000)，否则文件系统依然会被截断
        find target/linux/mediatek/image -type f -exec sed -i 's/40960k/256512k/g' {} +

    - name: Generate Config & Download
      working-directory: ./openwrt
      run: |
        cp ../.config .config
        make defconfig
        make download -j8

    - name: Compile Pure Firmware
      working-directory: ./openwrt
      run: |
        make -j$(nproc) || make -j1 V=s

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WAX206-256M-Pure-Firmware
        path: |
          openwrt/bin/targets/mediatek/*/*.itb
          openwrt/bin/targets/mediatek/*/*.bin
