name: Build WAX206 256M (Ultimate Fix)

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Free Disk Space & Install Dependencies
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl

    - name: Clone OpenWrt Source (Latest Master)
      run: |
        git clone https://github.com/openwrt/openwrt.git openwrt

    - name: Inject 256M Patch (Global Regex Search)
      working-directory: ./openwrt
      run: |
        echo "==== 1. 扩容打包体积上限 ===="
        # 寻找定义了 40960k (40M) 体积上限的 Makefile 文件
        FILES_MK=$(find target/linux/mediatek/image -type f -name "*.mk" -exec grep -l "40960k" {} +)
        if [ -z "$FILES_MK" ]; then
            echo "致命错误：找不到定义了 40960k 的 mk 文件！"
            exit 1
        fi
        for mk in $FILES_MK; do
            echo "修改打包体积限制: $mk"
            sed -i 's/40960k/256512k/g' "$mk"
        done

        echo "==== 2. 扩容底层物理分区 ===="
        # 全局扫描含有 40M (0x2800000) 分区定义的补丁或设备树文件
        TARGET_FILES=$(find target/linux/mediatek -type f -exec grep -l "0x2800000" {} +)
        
        if [ -z "$TARGET_FILES" ]; then
            echo "致命错误：全目录扫描找不到 0x2800000 的物理分区配置文件！"
            exit 1
        fi

        for file in $TARGET_FILES; do
            echo "正在注入扩容代码至: $file"
            
            # A. 废弃 backup 分区（将其长度设为 0x0，彻底避免空间重叠报错）
            # 正则 [[:space:]]\+ 用于兼容不同源码中任意数量的空格或 Tab
            sed -i 's/0x2d80000[[:space:]]\+0x2800000/0x2d80000 0x0/g' "$file"
            
            # B. 废弃 dummy 分区（将其长度设为 0x0）
            sed -i 's/0x5580000[[:space:]]\+0xaa80000/0x5580000 0x0/g' "$file"
            
            # C. 剩下的 0x2800000 就是主 firmware 分区，暴力扩充至 250MB+ (0xfa80000)
            sed -i 's/0x2800000/0xfa80000/g' "$file"
        done
        echo "扩容代码完美注入！"

    - name: Update Feeds & Configure
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        cp ../.config .config
        make defconfig
        make download -j8

    - name: Compile Firmware
      working-directory: ./openwrt
      run: |
        make -j$(nproc) || make -j1 V=s

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WAX206-256M-Pure-Firmware
        path: |
          openwrt/bin/targets/mediatek/*/*.itb
          openwrt/bin/targets/mediatek/*/*.bin
